<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Grade Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm rounded-4">
                    <div class="card-body p-4">
                        <h2 class="card-title text-center mb-4">🎓 Student Grade Predictor</h2>

                        <form method="POST">
                            <div class="mb-3">
                                <label for="G1" class="form-label">G1 (First Period Grade)</label>
                                <input type="number" step="0.1" class="form-control" name="G1" required>
                            </div>
                            <div class="mb-3">
                                <label for="G2" class="form-label">G2 (Second Period Grade)</label>
                                <input type="number" step="0.1" class="form-control" name="G2" required>
                            </div>
                            <div class="mb-3">
                                <label for="studytime" class="form-label">Study Time (1-4)</label>
                                <select class="form-select" name="studytime" required>
                                    <option value="1">1 - &lt; 2 hours</option>
                                    <option value="2">2 - 2 to 5 hours</option>
                                    <option value="3">3 - 5 to 10 hours</option>
                                    <option value="4">4 - &gt; 10 hours</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="failures" class="form-label">Failures (0-3, else 4)</label>
                                <input type="number" class="form-control" name="failures" min="0" max="4" required>
                            </div>
                            <div class="mb-3">
                                <label for="absences" class="form-label">Absences (0-93)</label>
                                <input type="number" class="form-control" name="absences" min="0" max="93" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Predict Grade</button>
                        </form>

                        {% if prediction is not none %}
                            <div class="alert alert-success mt-4 text-center">
                                <strong>Predicted Final Grade (G3):</strong> {{ prediction }}
                            </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
